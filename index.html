<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>공부 계획표</title>
  <script>
    try {
      var t = localStorage.getItem('theme_v1');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&family=Jua&display=swap">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <h1>공부 계획표</h1>
      <div class="sub" id="head"></div>
    </header>
    <nav id="nav" aria-label="주요 화면"></nav>
    <div id="sync-banner" class="sync-banner-slot"></div>
    <main id="app"></main>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
