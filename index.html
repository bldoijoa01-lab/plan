<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>공부 계획표</title>
  <script>
    try {
      var t = localStorage.getItem('theme_v1');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Jua&display=swap">
  <link rel="stylesheet" href="./styles/main.css?v=20261115-20">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
  </div>
  <div class="wrap">
    <header class="site-header app-header">
      <div class="site-brand">
        <button type="button" class="brand-btn" data-sec="home" title="홈으로 이동">
          <span class="brand-logo">✦</span>
          <span class="brand-text">
            <strong>공부 계획표</strong>
            <small>STUDY &amp; SCHEDULE HUB</small>
          </span>
        </button>
      </div>
      <nav id="top-nav" class="top-nav" aria-label="대분류 메뉴"></nav>
      <div class="sub head-controls" id="head"></div>
    </header>
    <section class="subnav-bar" id="subnav-bar" aria-label="하위 분야 탐색">
      <div class="subnav-meta" id="subnav-meta"></div>
      <nav id="nav" class="sub-nav" aria-label="하위 분야 메뉴"></nav>
    </section>
    <div id="sync-banner" class="sync-banner-slot"></div>
    <main id="app"></main>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="./src/app.js?v=20261115-20"></script>
</body>
</html>
